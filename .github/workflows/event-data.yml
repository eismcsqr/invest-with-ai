name: Event data pull

# Pulls the 12 v1 event types (tracker task "Event data") from their checked
# sources, writes the event tables and lines each event up with sector and
# stock returns (scripts/build_event_data.py). Commits the market-wide and
# industry tables, sector moves, counts and the check report to
# data/events/pull/. Company events come from Sharadar: they stay on the
# runner (licence) and only counts are committed.
#
# Needs SHARADAR_API_KEY and FRED_API_KEY. SEC_USER_AGENT is optional.
# EDGAR search results are cached between runs, so only recent months are
# fetched again each week.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"   # Saturdays 18:00 UTC (10 AM Pacific), after the company pull
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - scripts/build_event_data.py
      - config/regulation_agencies.csv
      - .github/workflows/event-data.yml

permissions:
  contents: write

concurrency:
  group: event-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel readers
        run: python -m pip install --quiet xlrd==2.0.1 openpyxl==3.1.5

      - name: Restore EDGAR search cache
        uses: actions/cache/restore@v4
        with:
          path: raw/event_cache
          key: event-cache-${{ github.run_id }}
          restore-keys: |
            event-cache-

      - name: Pull events and line them up with returns
        env:
          SHARADAR_API_KEY: ${{ secrets.SHARADAR_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EDGAR_BUDGET_MIN: "75"
        run: python scripts/build_event_data.py

      - name: Save EDGAR search cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: raw/event_cache
          key: event-cache-${{ github.run_id }}

      - name: Commit data changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/events/pull ] || { echo "Nothing to commit."; exit 0; }
          git add data/events/pull
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update event data ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "::error::Could not push the data commit."
          exit 1
