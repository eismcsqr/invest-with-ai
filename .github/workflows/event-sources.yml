name: Event sources check

# Opens each candidate source for the 12 agreed event types (tracker task
# "Event sources") and commits a small summary to data/events/sources/.
# Runs on demand and whenever the check script or this workflow changes.
# Sharadar's raw tables stay on the runner (licence and size).
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - scripts/check_event_sources.py
      - .github/workflows/event-sources.yml

permissions:
  contents: write

concurrency:
  group: event-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel readers
        run: python -m pip install --quiet xlrd==2.0.1 openpyxl==3.1.5

      - name: Check event sources
        env:
          SHARADAR_API_KEY: ${{ secrets.SHARADAR_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/check_event_sources.py

      - name: Commit the summary
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/events/sources ] || { echo "Nothing to commit."; exit 0; }
          git add data/events/sources
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update event sources check ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "::error::Could not push the summary commit."
          exit 1
