name: Macro data pull

# Fetches the macro pillar's FRED series (config/fred_series.csv) and Kenneth
# French's 12 industry portfolios and market factors, writes them under data/
# with a check report, and commits any changes back to the branch it ran on.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 6"   # Saturdays 14:00 UTC (6 AM Pacific)
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - scripts/fetch_macro_data.py
      - config/fred_series.csv
      - .github/workflows/macro-data.yml

permissions:
  contents: write

concurrency:
  group: macro-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and write the check report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_macro_data.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update macro data ($(date -u +%Y-%m-%d))"
          git push
