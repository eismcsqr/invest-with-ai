name: Probe sources (temporary)
on:
  push:
    branches: ["claude/project-thread-7i9u8t"]
    paths: [scripts/probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/probe/probe_fed.py
